[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odin-assistant"
version = "0.2.0"
description = "Local-first Windows desktop assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4", "piper-tts>=1.8"]

[project.scripts]
odin = "odin.cli:main"

[tool.setuptools.packages.find]
include = ["odin*"]
